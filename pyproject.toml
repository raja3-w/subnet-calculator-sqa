[project]
name = "ipcalc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raja Wayu Agung", email = "rajawayu3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.5",
]

[project.scripts]
ipcalc = "ipcalc:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
